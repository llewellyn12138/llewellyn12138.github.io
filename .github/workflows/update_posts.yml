name: Build and Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - 'blog-source/**'
      - 'apps/**'
      - 'games/**'
      - 'tools/**'
      - 'software/**'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - 'fonts/**'
      - '*.html'
      - 'scripts/**'
      - 'CNAME'
      - '.nojekyll'
      - '.gitignore'
      - '.github/workflows/update_posts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: blog-source/package-lock.json

      - name: Install dependencies
        working-directory: blog-source
        run: npm ci --no-audit --no-fund

      # build-site.js does everything: sync posts/, hexo clean+generate,
      # assemble dist/ (portal + /blog/ + manifests), write blog-latest.json.
      # Same script is used locally: node scripts/build-site.js
      - name: Build full site
        run: node scripts/build-site.js

      - name: Verify build output
        run: |
          node scripts/verify-build.js
          node scripts/scan-links.js
          node scripts/check-file-protocol.js
          node scripts/test-registry-render.js
          node scripts/test-static-fallback.js

      # Publishes the assembled static site to gh-pages.
      # IMPORTANT: GitHub Pages must be configured with
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # (or Source: Deploy from a branch -> gh-pages / root).
      # See DEPLOYMENT.md for the one-time setup and the CNAME caveat.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message || 'Deploy site' }}
